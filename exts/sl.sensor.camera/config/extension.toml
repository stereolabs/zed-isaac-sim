[package]
version = "5.4.0" # Semantic Versioning is used: https://semver.org/

# These fields are used primarily for display in the extension browser UI.
title = "Stereolabs ZED Camera"
description = "Integration of Stereolabs ZED cameras in Isaac Sim. Provides OmniGraph nodes for camera streaming and data capture with native ZED SDK support."
category = "Stereolabs"
keywords = ["Stereolabs", "ZED", "Camera", "Sensor", "OmniGraph", "Node", "Streaming"]
icon = "data/icon.png"
preview_image = ""
changelog = "docs/CHANGELOG.md"
readme  = "docs/README.md"
authors = ["Stereolabs"]
repository = "https://github.com/stereolabs/zed-isaac-sim"

# Watch the .ogn files for hot reloading (only works for Python files)
[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py"]

[package.target]
platform = ["windows-x86_64", "linux-x86_64"]
kit = ["110.1.2", "110.3.0", "110.4.0"] # Isaac Sim 6.0, 6.1 and 6.2: one build serves all three, the plugin ABI is identical

[package.writeTarget]
kit = true

[dependencies]
"omni.graph.core" = {}
"omni.graph.tools" = {}
"omni.graph.ui" = {} # Property-panel node templates (model-filtered Resolution dropdown)
"omni.usd.schema.omni_sensors" = {} # OmniSensorAPI schema -> omni:sensor:tickRate (multi-tick rendering)
"omni.warp.core" = {} # GPU sRGB encode of the streamed images (ZED_HdrToSrgb node)
"omni.kit.menu.utils" = { optional = true } # "ZED Cameras" lens panel menu entry (GUI only)
"isaacsim.gui.components" = { optional = true } # "ZED Cameras" lens panel window (GUI only)


[settings]
# "virtual" (receiver needs 5.6.0+): the ZED SDK generates each simulated camera's serial number
# and calibration.
# "legacy" (for 5.5.x receivers): serial numbers from the SDK's whitelist, calibration from their
# reserved file.
persistent.exts."sl.sensor.camera".simCameraMode = "virtual"
# How Play sets the app's timing so each stream sends every frame; Stop puts it back.
# "fit": a timing where no app update spans more than one frame is kept, otherwise the update rate goes
# to the highest multiple of the stream fps at or below it. "frame": the app updates once per frame, at
# the stream fps. "off": the app's timing is kept. When "fit" or "frame" changes the update rate, the
# physics rate goes up to a multiple of it if it is not one.
persistent.exts."sl.sensor.camera".streamTiming = "fit"

[[test]]
dependencies = ["omni.graph.action"] # OnPlaybackTick, for the streamer lifecycle test
stdoutFailPatterns.exclude = [
    "*[ZED] A camera prim must be specified.*",
    "*[ZED] At least one camera prim must be specified.*",
    "*[ZED][Depth] No camera prim specified.*",
]

[[python.module]]
name = "sl.sensor.camera"

[[native.plugin]]
path = "bin/*.plugin"

[[native.library]]
"filter:platform"."linux-x86_64".path = "bin/${lib_prefix}sl_zed${lib_ext}"
"filter:platform"."windows-x86_64".path = "bin/${lib_prefix}sl_zed64${lib_ext}"

[documentation]
pages = [
    "docs/README.md",
    "docs/CHANGELOG.md",
]
