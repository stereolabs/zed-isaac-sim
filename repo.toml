########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]

# Use the Kit Template repo configuration as a base. Only override things specific to the repo.
import_configs = ["${root}/_repo/deps/repo_kit_tools/kit-template/repo.toml"]

# Repository Name
name = "IsaacSimZED"

[repo_build]
post_build.commands = []
licensing.enabled = false
fetch.pip.licensing_enabled = false

[repo_build.docker]
enabled = false

[repo_build.msbuild]
link_host_toolchain = true
vs_version = "vs2022" # Local default: drive msbuild with VS2022. ABI stays compatible because the compiler toolset is pinned to v142 (MSVC_VERSION in premake5.lua) - the actual USD-libs-vs2022 concern is the toolset, not the IDE year. Requires the v142 (14.27) build-tools component installed in VS2022. CI overrides below.
"token:in_ci==true".vs_version = "vs2019"
"token:in_ci==true".vs_path = "C:\\vs2019"

[[repo_kit_pull_extensions.environment]]
name = "integ"
app_version_regex = ""
tokens.registry_url = "https://ovextensionsprod.blob.core.windows.net"
tokens.registry_shared_name = "shared"
tokens.registry_name = "kit/prod"

[repo_precache_exts]
registries = [
    { name = "kit/default", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/${kit_version_major}/shared" },
    { name = "kit/sdk", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/sdk/${kit_version_short}/${kit_git_hash}" },
]

ext_folders = [
  "${root}/exts"
]

[repo_symstore]
enabled = false

[repo_publish_exts]
# Publish exactly these three extensions (explicit, so default discovery can never pull in
# a dependency by accident). All three must be staged into _build/.../exts/ first, which the
# per-extension premake5.lua files handle.
exts.include = [
    "sl.sensor.camera",
    "sl.sensor.camera.calibration_exporter",
    "sl.sensor.camera.demo",
]
# No codesign certs on dev machines; publish unsigned. Re-enable if publishing from CI.
signing.enabled = false
